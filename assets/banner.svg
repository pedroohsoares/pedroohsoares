      <stop offset="0" stop-color="#1A0B33"/>
      <stop offset="0.55" stop-color="#3B1A6B"/>
      <stop offset="1" stop-color="#5B2A9E"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A1252" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4A2285" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1117"/>
