<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Pedro Soares — Estudante de Sistemas de Informação e desenvolvimento web">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1117"/>
      <stop offset="1" stop-color="#0F2A30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect x="0" y="0" width="6" height="300" fill="url(#accent)"/>

    <text x="70" y="135" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Pedro Soares</text>
    <rect x="72" y="156" width="64" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" fill="#CFE8E6">Sistemas de Informação · Desenvolvimento Web</text>
    <text x="70" y="234" font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="15" fill="#6F8A8C">Montes Claros, MG · Brasil</text>

    <g transform="translate(740 50)">
      <rect width="400" height="200" rx="12" fill="#0A1418" stroke="#2DD4BF" stroke-opacity="0.25"/>
      <circle cx="22" cy="22" r="5.5" fill="#FF5F57"/>
      <circle cx="42" cy="22" r="5.5" fill="#FEBC2E"/>
      <circle cx="62" cy="22" r="5.5" fill="#28C840"/>
      <g font-family="'SF Mono',Consolas,'Courier New',monospace" font-size="16">
        <text x="24" y="66"  fill="#6F8A8C">const <tspan fill="#2DD4BF">pedro</tspan> <tspan fill="#CFE8E6">= {</tspan></text>
        <text x="48" y="94"  fill="#CFE8E6">curso: <tspan fill="#38BDF8">"Sistemas de Informação"</tspan>,</text>
        <text x="48" y="122" fill="#CFE8E6">faculdade: <tspan fill="#38BDF8">"UNIMONTES"</tspan>,</text>
        <text x="48" y="150" fill="#CFE8E6">foco: <tspan fill="#38BDF8">"web &amp; back-end"</tspan></text>
        <text x="24" y="172" fill="#CFE8E6">};</text>
      </g>
    </g>
  </g>
</svg>
