    <text x="600" y="125" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Pedro Soares</text>
    <text x="600" y="168" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#EDE4FF">Software Developer · Web · Estratégia Digital</text>
